<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Garmin Companion</title>
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Companion">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        // Theme and palette chosen in Settings, applied before painting to avoid flicker
        // (app.js sets the browser bar color on startup)
        try {
            var theme = localStorage.getItem('gc_theme');
            if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
            var palette = localStorage.getItem('gc_palette');
            if (palette === 'track' || palette === 'volt' || palette === 'dawn') document.documentElement.setAttribute('data-palette', palette);
        } catch (e) { /* no storage: follow the system */ }
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="topbar" id="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="/static/icon.png" alt="" width="28" height="28">
            </div>
            <div class="small-title" id="smallTitle" aria-hidden="true"></div>
            <div class="topbar-actions">
                <button id="helpBtn" class="icon-btn" type="button" hidden>
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.85.85c0 1.65-2.45 2.2-2.45 3.7"/><path d="M12 17h.01"/></svg>
                </button>
                <button id="profileBtn" class="avatar-btn" type="button" hidden>
                    <span class="avatar-initial" id="profileInitial"></span>
                    <span class="avatar-dot" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </header>

    <main id="view" class="container">
        <div class="loading"><span class="spinner"></span></div>
    </main>

    <nav id="tabs" class="tabbar" role="tablist" hidden>
        <button type="button" class="tab" role="tab" data-tab="today" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="tab-label"></span>
        </button>
        <button type="button" class="tab" role="tab" data-tab="plan" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            <span class="tab-label"></span>
        </button>
        <button type="button" class="tab" role="tab" data-tab="progress" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16l4-5 3 3 5-7"/></svg>
            <span class="tab-label"></span>
        </button>
    </nav>

    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-head" id="sheetHead">
                <div class="grabber" aria-hidden="true"></div>
                <div class="sheet-title-row">
                    <h2 id="sheetTitle"></h2>
                    <button type="button" class="round-btn small" data-close aria-label="Close">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
            </div>
            <div id="sheetBody" class="sheet-body"></div>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script src="/static/js/help.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
